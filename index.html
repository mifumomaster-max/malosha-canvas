<!doctype html>
<html lang="sw" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malosha Poster Studio - Mtengeneza Mabango</title>
    <meta name="description" content="Malosha Poster Studio - Mfumo wa kisasa wa kutengeneza na kubuni violezo vya mabango wenye uwezo wa kupakua picha katika ubora wa hali ya juu (Ultra HD, PNG, JPG, PDF)." />
    <meta property="og:title" content="Malosha Poster Studio - Mtengeneza Mabango" />
    <meta property="og:description" content="Malosha Poster Studio - Mfumo wa kisasa wa kutengeneza na kubuni violezo vya mabango wenye uwezo wa kupakua picha katika ubora wa hali ya juu (Ultra HD, PNG, JPG, PDF)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        overscroll-behavior-y: none;
        background-color: #09090b;
        color: #f5f5f5;
      }
      #mps-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, rgba(251, 191, 36, 0.08), transparent 55%), #09090b;
        font-family: 'Outfit', system-ui, -apple-system, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .mps-emblem {
        width: 68px;
        height: 68px;
        border-radius: 18px;
        background: #171717;
        border: 1px solid rgba(251, 191, 36, 0.28);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 45px -12px rgba(0, 0, 0, 0.75);
        margin-bottom: 20px;
      }
      .mps-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #ffffff;
        margin: 0 0 6px 0;
      }
      .mps-sub {
        font-size: 13px;
        color: #a3a3a3;
        margin: 0 0 22px 0;
      }
      .mps-track {
        width: 220px;
        height: 3px;
        background: #262626;
        border-radius: 9999px;
        overflow: hidden;
      }
      .mps-bar {
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, #f59e0b, #fbbf24);
        border-radius: 9999px;
        animation: mpsSlide 1.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      @keyframes mpsSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-amber-500 selection:text-black">
    <div id="root">
      <div id="mps-preloader" aria-label="Inapakia Malosha Poster Studio">
        <div class="mps-emblem">
          <svg width="34" height="34" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="4" width="18" height="24" rx="3" stroke="#525252" stroke-width="2" />
            <rect x="12" y="8" width="18" height="24" rx="3" fill="#171717" stroke="#fbbf24" stroke-width="2.2" />
            <path d="M16 15H26M16 20H23" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
            <circle cx="23.5" cy="25.5" r="2.2" fill="#fbbf24" />
          </svg>
        </div>
        <h1 class="mps-title">Malosha Poster Studio</h1>
        <p class="mps-sub">Inaandaa studio yako ya ubunifu...</p>
        <div class="mps-track">
          <div class="mps-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

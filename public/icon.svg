<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="120" y1="100" x2="392" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="150" y1="120" x2="370" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#goldGlow)" />

  <!-- Subtle outer luxury gold rim -->
  <rect x="18" y="18" width="476" height="476" rx="96" stroke="url(#goldGrad)" stroke-opacity="0.35" stroke-width="4" />

  <!-- Back Poster Layer -->
  <rect x="108" y="92" width="244" height="308" rx="34" transform="rotate(-7 230 246)" fill="#0f172a" stroke="#64748b" stroke-opacity="0.55" stroke-width="8" />

  <!-- Front Main Poster Card -->
  <rect x="156" y="108" width="248" height="316" rx="36" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="11" />

  <!-- Inside Poster: Gold Header Ribbon & M Monogram -->
  <rect x="188" y="142" width="184" height="22" rx="11" fill="url(#goldGrad)" />
  <path d="M204 304 V196 L246 254 L280 202 L314 254 L356 196 V304" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Bottom Sparkle & Chart Dots -->
  <rect x="192" y="344" width="96" height="14" rx="7" fill="#38bdf8" />
  <rect x="192" y="370" width="64" height="12" rx="6" fill="#94a3b8" fill-opacity="0.7" />
  <circle cx="344" cy="360" r="24" fill="url(#goldGrad)" />
  <path d="M344 344 L348.5 355.5 L360 360 L348.5 364.5 L344 376 L339.5 364.5 L328 360 L339.5 355.5 Z" fill="#09090b" />
</svg>
